[package]
name = "mbr-envelope"
version = "1.0.2"
edition = "2024"
description = "Biblioteca pura para construcao e evolucao de trace do Envelope Oficial MBR"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
